apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "qc-nks-public-edge"
  namespace: "argocd"
spec:
  project: "default"
  source:
    repoURL: "https://github.com/quantum-platform-kist/quantum-orchestration-helmchart.git"
    targetRevision: "prod"
    path: "infra/nks-public-edge"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "argocd"
  syncPolicy:
    syncOptions:
      - "Prune=false"
      - "CreateNamespace=false"
