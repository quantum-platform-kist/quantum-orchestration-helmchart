{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "qc-nks-prod-stateful",
    "namespace": "argocd"
  },
  "spec": {
    "project": "default",
    "source": {
      "repoURL": "https://github.com/quantum-platform-kist/quantum-orchestration-helmchart.git",
      "targetRevision": "prod",
      "path": "charts/qc-prod-stateful",
      "helm": {
        "valueFiles": [
          "../../values/prod-stateful.yaml",
          "../../values/nks-prod-stateful.yaml"
        ]
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "quantum-cloud-prod"
    },
    "syncPolicy": {
      "automated": {
        "enabled": true,
        "prune": false,
        "selfHeal": true,
        "allowEmpty": false
      },
      "syncOptions": [
        "CreateNamespace=false"
      ]
    }
  }
}
