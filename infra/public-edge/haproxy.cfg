# Quantum Cloud public edge.
# TLS is not terminated here. This host only accepts the two QC SNI names and
# forwards the original TLS stream to the Cilium Gateway VIP.

global
  log /dev/log local0
  log /dev/log local1 notice
  master-worker
  stats socket /run/qc-public-edge/admin.sock mode 660 level admin expose-fd listeners
  stats timeout 30s
  user haproxy
  group haproxy

defaults
  log global
  option dontlognull
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout client-fin 30s
  timeout server-fin 30s

frontend qc_https_passthrough
  bind 0.0.0.0:443
  mode tcp
  option tcplog

  tcp-request inspect-delay 5s
  acl sni_present req.ssl_sni -m found
  acl qc_sni req.ssl_sni -i qc.quantum-instrument.com modules.qc.quantum-instrument.com

  tcp-request content reject if sni_present !qc_sni
  tcp-request content accept if qc_sni
  tcp-request content reject if WAIT_END

  use_backend cilium_gateway_https if qc_sni

frontend qc_http_redirect
  bind 0.0.0.0:80
  mode http
  option httplog

  acl qc_http_host hdr(host) -i qc.quantum-instrument.com qc.quantum-instrument.com:80 modules.qc.quantum-instrument.com modules.qc.quantum-instrument.com:80

  http-request deny deny_status 421 unless qc_http_host
  http-request redirect scheme https code 308 if qc_http_host

backend cilium_gateway_https
  mode tcp
  option tcp-check
  tcp-check connect
  server cilium-gateway 10.42.2.2:443 check inter 5s rise 2 fall 3
