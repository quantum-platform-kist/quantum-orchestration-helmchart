apiVersion: "v1"
kind: "Service"
metadata:
  name: "qc-public-proxy"
  namespace: "argocd"
  labels:
    app.kubernetes.io/part-of: "quantum-cloud-public-edge"
    app.kubernetes.io/name: "qc-public-proxy"
  annotations:
    alb.ingress.kubernetes.io/healthcheck-protocol: "HTTP"
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  type: "NodePort"
  selector:
    app.kubernetes.io/name: "qc-public-proxy"
  ports:
    -
      protocol: "TCP"
      port: 8080
      name: "http"
      targetPort: "http"
      nodePort: 30203
  externalTrafficPolicy: "Cluster"
