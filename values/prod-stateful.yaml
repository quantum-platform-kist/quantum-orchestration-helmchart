global:
  namespace: quantum-cloud-prod
  storageClassName: fab-lvm-retain
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - ghcr
  nodePlacement:
    data:
      nodeSelector:
        kubernetes.io/hostname: prod-k8s-02
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [prod-k8s-02]
      tolerations:
        - key: fab.kist/dedicated
          operator: Equal
          value: data
          effect: NoSchedule
    web:
      nodeSelector:
        kubernetes.io/hostname: prod-k8s-03
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [prod-k8s-03]
      tolerations: []

