      name: setup.stp_nv_a1.experiment.start
      partitions: 1
      replicationFactor: 1
      retentionMs: 86400000
      retentionBytes: 134217728
    stp_nv_a1_experiment_cancel:
      name: setup.stp_nv_a1.experiment.cancel
      partitions: 1
      replicationFactor: 1
      retentionMs: 86400000
      retentionBytes: 134217728
    stp_nv_a1_experiment_end:
      name: setup.stp_nv_a1.experiment.end
      partitions: 1
      replicationFactor: 1
      retentionMs: 86400000
      retentionBytes: 134217728

minio:
  storage: 10Gi
