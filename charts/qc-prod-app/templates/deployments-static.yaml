apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
  namespace: {{ include "qc-app.namespace" . }}
  labels:
    {{- include "qc-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: shell
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.apps.shell.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shell
  template:
    metadata:
      annotations:
        # nginx default.conf is mounted with subPath, which never refreshes in a running pod.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: shell
        app.kubernetes.io/component: web
        qc.quantum-cloud/role: app
    spec:
      {{- include "qc-app.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-app.webPlacement" . | nindent 6 }}
      containers:
        - name: shell
          image: {{ include "qc-app.image" .Values.images.shell }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apps.shell.port }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          {{- include "qc-app.staticProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.apps.shell.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: shell-nginx
---
