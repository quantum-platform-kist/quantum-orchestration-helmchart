apiVersion: v1
kind: ConfigMap
metadata:
  name: shell-nginx
  namespace: {{ include "qc-app.namespace" . }}
  labels:
    {{- include "qc-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: shell
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      "" close;
    }

    map $http_x_forwarded_proto $qc_forwarded_proto {
      default $http_x_forwarded_proto;
      "" "https";
    }

    server {
      listen 8080;
      server_name _;
      client_max_body_size 25m;
      root /usr/share/nginx/html;
      index index.html;
      resolver {{ .Values.global.dnsResolver }} valid=10s ipv6=off;
      set $gateway_upstream gateway.{{ include "qc-app.namespace" . }}.svc.cluster.local:{{ .Values.apps.gateway.port }};

      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' {{ include "qc-app.shellOrigin" . }} wss://{{ .Values.global.hosts.shell }} {{ include "qc-app.modulesOrigin" . }} wss://{{ .Values.global.hosts.modules }}; frame-src {{ include "qc-app.modulesOrigin" . }}; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      add_header Cross-Origin-Embedder-Policy "credentialless" always;
      add_header X-Content-Type-Options "nosniff" always;

      location = /health {
        access_log off;
        return 200 "ok\n";
      }

      location /server/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto $qc_forwarded_proto;
        proxy_set_header Forwarded "proto=$qc_forwarded_proto;host=$host";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cookie_path /api/auth/signup /server/api/auth/signup;
        proxy_cookie_path /api/auth /server/api/auth;
        rewrite ^/server/?(.*)$ /$1 break;
        proxy_pass http://$gateway_upstream;
      }

      location = /server {
        return 308 /server/;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: setup-modules-nginx
  namespace: {{ include "qc-app.namespace" . }}
  labels:
    {{- include "qc-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: setup-modules
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      "" close;
    }

    map $http_x_forwarded_proto $qc_forwarded_proto {
      default $http_x_forwarded_proto;
      "" "https";
    }

    server {
      listen 8080;
      server_name _;
      client_max_body_size 25m;
      resolver {{ .Values.global.dnsResolver }} valid=10s ipv6=off;
      set $registry_upstream setup-registry.{{ include "qc-app.namespace" . }}.svc.cluster.local:{{ .Values.apps.setupRegistry.port }};
      set $setup_a_be_upstream setup-a-be.{{ include "qc-app.namespace" . }}.svc.cluster.local:{{ .Values.apps.setupABe.port }};

      location = /health {
        access_log off;
        return 200 "ok\n";
      }

      location /qc-sdk/ {
        alias /usr/share/nginx/html/qc-sdk/;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
      }

      location /module-assets/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto $qc_forwarded_proto;
        proxy_set_header Forwarded "proto=$qc_forwarded_proto;host=$host";
        proxy_buffering off;
        proxy_hide_header X-Frame-Options;
        add_header Allow-CSP-From "{{ include "qc-app.shellOrigin" . }}" always;
        rewrite ^/module-assets/?(.*)$ /module-assets/$1 break;
        proxy_pass http://$registry_upstream;
      }

      location ~ ^/api/setup-a/(setups/{{ .Values.global.moduleSetupId }}/setup-a(?:/.*)?)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto $qc_forwarded_proto;
        proxy_set_header Forwarded "proto=$qc_forwarded_proto;host=$host";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        rewrite ^/api/setup-a/(setups/{{ .Values.global.moduleSetupId }}/setup-a(?:/.*)?)$ /$1 break;
        proxy_pass http://$setup_a_be_upstream;
      }

      location / {
        return 404;
      }
    }
