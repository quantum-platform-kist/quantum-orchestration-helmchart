              value: {{ printf "jdbc:mysql://%s:3306/setup_a?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul" .Values.statefulServices.mysql | quote }}
            - name: AUTH_SERVICE_URL
              value: http://auth:8081
            - name: JWKS_URL
              value: http://auth:8081/.well-known/jwks.json
            - name: JWT_ISSUER
              value: {{ .Values.global.issuer | quote }}
            - name: SETUP_A_ALLOWED_ORIGINS
              value: {{ printf "%s,%s" (include "qc-app.shellOrigin" .) (include "qc-app.modulesOrigin" .) | quote }}
            - name: JOB_ORCHESTRATOR_BASE_URL
              value: http://gateway:8080/api
            - name: SETUP_REGISTRY_BASE_URL
              value: http://gateway:8080/api
            - name: JOB_ORCHESTRATOR_INTERNAL_BASE_URL
              value: http://job-orchestrator:8083
            - name: SETUP_REGISTRY_INTERNAL_BASE_URL
