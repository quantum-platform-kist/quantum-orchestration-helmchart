              value: {{ .Values.apps.setupABe.measurementKafkaGroupId | quote }}
            - name: SETUP_A_MEASUREMENT_DEMO_ENABLED
              value: {{ .Values.apps.setupABe.measurementDemoEnabled | quote }}
            - name: QUANTUM_SETUP_SECURITY_CLIENT_ID
              value: {{ printf "setup-be:%s" .Values.global.moduleSetupId | quote }}
            - name: QUANTUM_SETUP_SECURITY_AUTH_TOKEN_URI
              value: http://auth:8081/oauth2/token
            {{- include "qc-app.secretEnv" (dict "name" "SETUP_A_DB_USERNAME" "secretName" .Values.secrets.app.name "key" "SETUP_A_DB_USERNAME") | nindent 12 }}
            {{- include "qc-app.secretEnv" (dict "name" "SETUP_A_DB_PASSWORD" "secretName" .Values.secrets.app.name "key" "SETUP_A_DB_PASSWORD") | nindent 12 }}
