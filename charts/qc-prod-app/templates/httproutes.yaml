apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qc-shell
  namespace: {{ include "qc-app.namespace" . }}
  labels:
    {{- include "qc-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: qc-shell-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
      sectionName: {{ .Values.global.gateway.shellSectionName }}
  hostnames:
    - {{ .Values.global.hosts.shell | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shell
          port: {{ .Values.apps.shell.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qc-modules
  namespace: {{ include "qc-app.namespace" . }}
  labels:
    {{- include "qc-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: qc-modules-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.global.gateway.name }}
      namespace: {{ .Values.global.gateway.namespace }}
      sectionName: {{ .Values.global.gateway.moduleSectionName }}
  hostnames:
    - {{ .Values.global.hosts.modules | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: setup-modules
          port: {{ .Values.apps.setupModules.port }}

