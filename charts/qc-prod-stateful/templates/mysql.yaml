{{- if .Values.mysql.enabled }}
apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: {{ .Values.mysql.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.mysql.name }}
    app.kubernetes.io/component: mysql
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  secretName: {{ required "mysql.rootExistingSecret is required" .Values.mysql.rootExistingSecret }}
  tlsUseSelfSigned: true
  version: {{ .Values.mysql.version | quote }}
  podSpec:
    {{- include "qc-stateful.dataPlacement" . | nindent 4 }}
  instances: {{ .Values.mysql.instances }}
  router:
    instances: {{ .Values.mysql.routers }}
    podSpec:
      {{- include "qc-stateful.webPlacement" . | nindent 6 }}
  mycnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    log_bin_trust_function_creators=1
  datadirVolumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    storageClassName: {{ .Values.global.storageClassName }}
    resources:
      requests:
        storage: {{ .Values.mysql.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.mysql.name }}-app-bootstrap
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.mysql.name }}-app-bootstrap
    app.kubernetes.io/component: mysql-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.mysql.name }}-app-bootstrap
        app.kubernetes.io/component: mysql-bootstrap
        qc.quantum-cloud/role: stateful-job
    spec:
      restartPolicy: OnFailure
      {{- include "qc-stateful.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-stateful.webPlacement" . | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ include "qc-stateful.fullImage" .Values.mysql.initImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.rootExistingSecret }}
                  key: {{ .Values.mysql.rootPasswordKey }}
            {{- range $schemaName, $schema := .Values.mysql.schemas }}
            - name: {{ upper $schemaName }}_DB_NAME
              value: {{ $schema.database | quote }}
            - name: {{ upper $schemaName }}_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.mysql.appCredentialsSecret }}
                  key: {{ $schema.usernameKey }}
            - name: {{ upper $schemaName }}_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.mysql.appCredentialsSecret }}
                  key: {{ $schema.passwordKey }}
            {{- end }}
          command:
            - bash
            - -ec
          args:
            - |
              set -euo pipefail
              mysql_host="{{ .Values.mysql.name }}"
              until mysql -h "${mysql_host}" -P 3306 -uroot -e "SELECT 1" >/dev/null 2>&1; do
                sleep 5
              done

              escape_mysql_string() {
                local value="$1"
                value="${value//\\/\\\\}"
                value="${value//\'/\'\'}"
                printf '%s' "$value"
              }

              create_app_schema() {
                local db_name="$1"
                local db_user="$2"
                local db_password="$3"
                [[ "$db_name" =~ ^[a-zA-Z0-9_]+$ ]] || exit 1
                [[ "$db_user" =~ ^[a-zA-Z0-9_:@.-]+$ ]] || exit 1
                escaped_password="$(escape_mysql_string "$db_password")"
                mysql -h "${mysql_host}" -P 3306 -uroot <<SQL
              SET SESSION sql_mode='';
              CREATE DATABASE IF NOT EXISTS \`${db_name}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE USER IF NOT EXISTS '${db_user}'@'%' IDENTIFIED BY '${escaped_password}';
              ALTER USER '${db_user}'@'%' IDENTIFIED BY '${escaped_password}';
              GRANT ALL PRIVILEGES ON \`${db_name}\`.* TO '${db_user}'@'%';
              FLUSH PRIVILEGES;
              SQL
              }

              {{- range $schemaName, $schema := .Values.mysql.schemas }}
              create_app_schema "${{ upper $schemaName }}_DB_NAME" "${{ upper $schemaName }}_DB_USER" "${{ upper $schemaName }}_DB_PASSWORD"
              {{- end }}
              echo "mysql application schemas are initialized"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
{{- end }}
