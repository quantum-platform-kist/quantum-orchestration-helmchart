{{- if and .Values.kafka.enabled (ne .Values.global.storageMode "ephemeral") }}
{{- include "qc-stateful.kafkaRetentionGuard" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.kafka.name }}-topic-init
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.kafka.name }}-topic-init
    app.kubernetes.io/component: kafka-topic-init
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.kafka.name }}-topic-init
        app.kubernetes.io/component: kafka-topic-init
        qc.quantum-cloud/role: stateful-job
    spec:
      restartPolicy: OnFailure
      {{- include "qc-stateful.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-stateful.webPlacement" . | nindent 6 }}
      containers:
        - name: topic-init
          image: {{ include "qc-stateful.fullImage" .Values.kafka.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ printf "%s:9092" .Values.kafka.name | quote }}
          command:
            - bash
            - -ec
          args:
            - |
              set -euo pipefail
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" --list >/dev/null 2>&1; do
                sleep 5
              done
              {{- range $key, $topic := .Values.kafka.topics }}
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
                --create --if-not-exists \
                --topic {{ $topic.name | quote }} \
                --partitions {{ default 1 $topic.partitions }} \
                --replication-factor {{ default 1 $topic.replicationFactor }} \
                --config cleanup.policy=delete \
                --config retention.ms={{ int64 (default $.Values.kafka.defaultRetentionMs $topic.retentionMs) }} \
                --config retention.bytes={{ int64 (required (printf "kafka.topics.%s.retentionBytes is required" $key) $topic.retentionBytes) }}
              /opt/kafka/bin/kafka-configs.sh \
                --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
                --entity-type topics \
                --entity-name {{ $topic.name | quote }} \
                --alter \
                --add-config cleanup.policy=delete,retention.ms={{ int64 (default $.Values.kafka.defaultRetentionMs $topic.retentionMs) }},retention.bytes={{ int64 $topic.retentionBytes }}
              {{- end }}
              echo "kafka topics are initialized"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
{{- end }}
