{{- if .Values.kafka.enabled }}
{{- include "qc-stateful.kafkaRetentionGuard" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.name }}-headless
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.kafka.name }}
    app.kubernetes.io/component: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
  selector:
    app.kubernetes.io/name: {{ .Values.kafka.name }}
    app.kubernetes.io/component: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.kafka.name }}
    app.kubernetes.io/component: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  type: ClusterIP
  ports:
    - name: broker
      port: 9092
      targetPort: broker
  selector:
    app.kubernetes.io/name: {{ .Values.kafka.name }}
    app.kubernetes.io/component: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.kafka.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.kafka.name }}
    app.kubernetes.io/component: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  serviceName: {{ .Values.kafka.name }}-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.kafka.name }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.kafka.name }}
        app.kubernetes.io/component: kafka
        qc.quantum-cloud/role: data
    spec:
      {{- include "qc-stateful.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-stateful.dataPlacement" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kafka
          image: {{ include "qc-stateful.fullImage" .Values.kafka.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@{{ .Values.kafka.name }}-0.{{ .Values.kafka.name }}-headless.{{ include "qc-stateful.namespace" . }}.svc.cluster.local:9093"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kafka-logs
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ .Values.kafka.name }}-0.{{ .Values.kafka.name }}-headless.{{ include "qc-stateful.namespace" . }}.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_RETENTION_MS
              value: {{ int64 .Values.kafka.defaultRetentionMs | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          {{- if eq .Values.global.storageMode "ephemeral" }}
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -ec
                  - |
                    set -euo pipefail
                    rm -f /tmp/qc-kafka-bootstrap-complete
                    export KAFKA_HEAP_OPTS="-Xms64m -Xmx128m"
                    if ! timeout -k 5 590 bash -euo pipefail <<'QC_KAFKA_BOOTSTRAP'
                    until timeout -k 2 20 /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1; do
                      sleep 3
                    done
                    {{- range $key, $topic := .Values.kafka.topics }}
                    timeout -k 2 25 /opt/kafka/bin/kafka-topics.sh \
                      --bootstrap-server 127.0.0.1:9092 \
                      --create --if-not-exists \
                      --topic {{ $topic.name | quote }} \
                      --partitions {{ default 1 $topic.partitions }} \
                      --replication-factor {{ default 1 $topic.replicationFactor }} \
                      --config cleanup.policy=delete \
                      --config retention.ms={{ int64 (default $.Values.kafka.defaultRetentionMs $topic.retentionMs) }} \
                      --config retention.bytes={{ int64 (required (printf "kafka.topics.%s.retentionBytes is required" $key) $topic.retentionBytes) }} >/dev/null 2>&1
                    timeout -k 2 25 /opt/kafka/bin/kafka-configs.sh \
                      --bootstrap-server 127.0.0.1:9092 \
                      --entity-type topics \
                      --entity-name {{ $topic.name | quote }} \
                      --alter \
                      --add-config cleanup.policy=delete,retention.ms={{ int64 (default $.Values.kafka.defaultRetentionMs $topic.retentionMs) }},retention.bytes={{ int64 $topic.retentionBytes }} >/dev/null 2>&1
                    {{- end }}
                    touch /tmp/qc-kafka-bootstrap-complete
                    QC_KAFKA_BOOTSTRAP
                    then
                      echo "Kafka bootstrap failed or timed out" >&2
                      exit 1
                    fi
                    echo "Kafka topics are initialized"
          startupProbe:
            exec:
              command:
                - bash
                - -ec
                - test -f /tmp/qc-kafka-bootstrap-complete && KAFKA_HEAP_OPTS="-Xms64m -Xmx128m" timeout -k 1 8 /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          {{- end }}
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                {{- if eq .Values.global.storageMode "ephemeral" }}
                - test -f /tmp/qc-kafka-bootstrap-complete && KAFKA_HEAP_OPTS="-Xms64m -Xmx128m" timeout -k 1 8 /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1
                {{- else }}
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null
                {{- end }}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
      {{- if eq .Values.global.storageMode "ephemeral" }}
      volumes:
        - name: data
          emptyDir:
            {{- toYaml (default dict .Values.kafka.emptyDir) | nindent 12 }}
      {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
      {{- end }}
{{- end }}
