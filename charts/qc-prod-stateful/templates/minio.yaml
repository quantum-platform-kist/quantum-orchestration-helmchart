{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.minio.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.minio.name }}
    app.kubernetes.io/component: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
  selector:
    app.kubernetes.io/name: {{ .Values.minio.name }}
    app.kubernetes.io/component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.minio.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.minio.name }}
    app.kubernetes.io/component: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  serviceName: {{ .Values.minio.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.minio.name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.minio.name }}
        app.kubernetes.io/component: minio
        qc.quantum-cloud/role: data
    spec:
      {{- include "qc-stateful.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-stateful.dataPlacement" . | nindent 6 }}
      containers:
        - name: minio
          image: {{ include "qc-stateful.fullImage" .Values.minio.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.accessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.secretKeyKey }}
          ports:
            - name: api
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 20
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.minio.name }}-bucket-bootstrap
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.minio.name }}-bucket-bootstrap
    app.kubernetes.io/component: minio-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.minio.name }}-bucket-bootstrap
        app.kubernetes.io/component: minio-bootstrap
        qc.quantum-cloud/role: stateful-job
    spec:
      restartPolicy: OnFailure
      {{- include "qc-stateful.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-stateful.webPlacement" . | nindent 6 }}
      containers:
        - name: mc
          image: {{ include "qc-stateful.fullImage" .Values.minio.mcImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.accessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.secretKeyKey }}
            - name: MODULE_STORAGE_BUCKET
              value: {{ .Values.minio.bucket | quote }}
          command:
            - sh
            - -ec
          args:
            - |
              until mc alias set qc http://{{ .Values.minio.name }}:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 5
              done
              mc mb --ignore-existing "qc/$MODULE_STORAGE_BUCKET"
              echo "minio bucket is initialized"
{{- end }}
