{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.minio.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.minio.name }}
    app.kubernetes.io/component: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
  selector:
    app.kubernetes.io/name: {{ .Values.minio.name }}
    app.kubernetes.io/component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.minio.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.minio.name }}
    app.kubernetes.io/component: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  serviceName: {{ .Values.minio.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.minio.name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.minio.name }}
        app.kubernetes.io/component: minio
        qc.quantum-cloud/role: data
    spec:
      {{- include "qc-stateful.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-stateful.dataPlacement" . | nindent 6 }}
      containers:
        - name: minio
          image: {{ include "qc-stateful.fullImage" .Values.minio.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.accessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.secretKeyKey }}
          ports:
            - name: api
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 20
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
        {{- if eq .Values.global.storageMode "ephemeral" }}
        - name: bucket-bootstrap
          image: {{ include "qc-stateful.fullImage" .Values.minio.mcImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.accessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.secretKeyKey }}
            - name: MODULE_STORAGE_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: MC_CONFIG_DIR
              value: /tmp/qc-mc
          command:
            - sh
            - -ec
          args:
            - |
              set -eu
              umask 077
              mkdir -p "$MC_CONFIG_DIR"
              chmod 700 "$MC_CONFIG_DIR"
              if ! timeout -k 5 590 sh -ec '
                until timeout -k 2 20 mc alias set qc http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                  sleep 3
                done
                until timeout -k 2 20 mc mb --ignore-existing "qc/$MODULE_STORAGE_BUCKET" >/dev/null 2>&1 &&
                      timeout -k 2 10 mc stat "qc/$MODULE_STORAGE_BUCKET" >/dev/null 2>&1; do
                  sleep 3
                done
              '; then
                echo "MinIO bucket bootstrap failed or timed out" >&2
                exit 1
              fi
              echo "MinIO bucket is initialized"
              trap 'exit 0' TERM INT
              while :; do
                sleep 3600 &
                wait "$!"
              done
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - timeout -k 1 5 mc stat "qc/$MODULE_STORAGE_BUCKET" >/dev/null 2>&1
            periodSeconds: 10
            timeoutSeconds: 8
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          emptyDir:
            {{- toYaml (default dict .Values.minio.emptyDir) | nindent 12 }}
        {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.minio.name }}-bucket-bootstrap
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.minio.name }}-bucket-bootstrap
    app.kubernetes.io/component: minio-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.minio.name }}-bucket-bootstrap
        app.kubernetes.io/component: minio-bootstrap
        qc.quantum-cloud/role: stateful-job
    spec:
      restartPolicy: OnFailure
      {{- include "qc-stateful.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-stateful.webPlacement" . | nindent 6 }}
      containers:
        - name: mc
          image: {{ include "qc-stateful.fullImage" .Values.minio.mcImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.accessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.credentialsSecret }}
                  key: {{ .Values.minio.secretKeyKey }}
            - name: MODULE_STORAGE_BUCKET
              value: {{ .Values.minio.bucket | quote }}
          command:
            - sh
            - -ec
          args:
            - |
              until mc alias set qc http://{{ .Values.minio.name }}:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 5
              done
              mc mb --ignore-existing "qc/$MODULE_STORAGE_BUCKET"
              echo "minio bucket is initialized"
        {{- end }}
{{- end }}
