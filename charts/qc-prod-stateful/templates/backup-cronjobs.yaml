{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qc-mysql-logical-backups
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: qc-mysql-logical-backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backup.pvc.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qc-mysql-logical-backup
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: qc-mysql-logical-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qc-mysql-logical-backup
            qc.quantum-cloud/role: stateful-job
        spec:
          restartPolicy: Never
          {{- include "qc-stateful.imagePullSecrets" . | nindent 10 }}
          {{- include "qc-stateful.webPlacement" . | nindent 10 }}
          containers:
            - name: mysqldump
              image: {{ include "qc-stateful.fullImage" .Values.backup.image }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mysql.rootExistingSecret }}
                      key: {{ .Values.mysql.rootPasswordKey }}
              command:
                - bash
                - -ec
              args:
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  mysqldump -h {{ .Values.mysql.name }} -uroot --single-transaction --routines --triggers --events --databases auth setup_registry job_orchestrator setup_a > "/backup/qc-${ts}.sql"
                  find /backup -type f -name 'qc-*.sql' -mtime +14 -delete
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: qc-mysql-logical-backups
{{- end }}

