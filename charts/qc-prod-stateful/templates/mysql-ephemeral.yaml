{{- if and .Values.mysql.enabled (eq .Values.global.storageMode "ephemeral") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.mysql.name }}-ephemeral-bootstrap
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.mysql.name }}
    app.kubernetes.io/component: mysql
data:
  10-qc-app-bootstrap.sh: |
    #!/bin/bash
    # The image sources this file while its temporary socket-only server runs.
    # Keep shell options and traps inside the subshell.
    (
      set -euo pipefail
      trap 'status=$?; if [ "$status" -ne 0 ]; then printf "mysql application bootstrap failed (exit=%s)\n" "$status" >&2; fi' EXIT
      export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"

      escape_mysql_string() {
        local value="$1"
        value="${value//\\/\\\\}"
        value="${value//\'/\'\'}"
        printf '%s' "$value"
      }

      create_app_schema() {
        local db_name="$1"
        local db_user="$2"
        local db_password="$3"
        local escaped_password
        [[ "$db_name" =~ ^[a-zA-Z0-9_]+$ ]] || exit 1
        [[ "$db_user" =~ ^[a-zA-Z0-9_:@.-]+$ ]] || exit 1
        escaped_password="$(escape_mysql_string "$db_password")"
        # Suppress SQL/client errors because they can contain credential text.
        timeout --signal=KILL 60s mysql --protocol=socket --socket="${SOCKET:?}" \
          --user=root --connect-timeout=5 --batch >/dev/null 2>&1 <<SQL
      SET SESSION sql_mode='';
      CREATE DATABASE IF NOT EXISTS \`${db_name}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      CREATE USER IF NOT EXISTS '${db_user}'@'%' IDENTIFIED BY '${escaped_password}';
      ALTER USER '${db_user}'@'%' IDENTIFIED BY '${escaped_password}';
      GRANT ALL PRIVILEGES ON \`${db_name}\`.* TO '${db_user}'@'%';
      FLUSH PRIVILEGES;
    SQL
      }

      {{- range $schemaName, $schema := .Values.mysql.schemas }}
      create_app_schema "${{ upper $schemaName }}_DB_NAME" "${{ upper $schemaName }}_DB_USER" "${{ upper $schemaName }}_DB_PASSWORD"
      {{- end }}
      touch /var/lib/mysql/.qc-app-bootstrap-complete
      printf '%s\n' 'mysql application schemas are initialized'
    )
  probe.sh: |
    #!/bin/bash
    set -euo pipefail
    test -f /var/lib/mysql/.qc-app-bootstrap-complete
    export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
    exec timeout --signal=KILL 5s mysql --protocol=TCP --host=127.0.0.1 \
      --port=3306 --user=root --connect-timeout=3 --batch --skip-column-names \
      --execute='SELECT 1' >/dev/null 2>&1
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mysql.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.mysql.name }}
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: {{ .Values.mysql.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mysql.name }}-headless
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.mysql.name }}
    app.kubernetes.io/component: mysql
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: {{ .Values.mysql.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.mysql.name }}
  namespace: {{ include "qc-stateful.namespace" . }}
  labels:
    {{- include "qc-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.mysql.name }}
    app.kubernetes.io/component: mysql
spec:
  serviceName: {{ .Values.mysql.name }}-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.mysql.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.mysql.name }}
        app.kubernetes.io/component: mysql
        qc.quantum-cloud/role: data
    spec:
      {{- include "qc-stateful.imagePullSecrets" . | nindent 6 }}
      {{- include "qc-stateful.dataPlacement" . | nindent 6 }}
      securityContext:
        # The pinned Oracle image runs mysqld as mysql (UID/GID 27).
        fsGroup: 27
      containers:
        - name: mysql
          image: {{ include "qc-stateful.fullImage" .Values.mysql.initImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/bash
            - -ec
          args:
            - |
              # Oracle's entrypoint interpolates this password into SQL/config.
              [[ "${MYSQL_ROOT_PASSWORD:-}" =~ ^[a-zA-Z0-9_-]{24,}$ ]] || exit 1
              unset MYSQL_RANDOM_ROOT_PASSWORD MYSQL_ONETIME_PASSWORD MYSQL_ALLOW_EMPTY_PASSWORD MYSQL_INITIALIZE_ONLY
              exec /entrypoint.sh mysqld --character-set-server=utf8mb4 \
                --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.rootExistingSecret }}
                  key: {{ .Values.mysql.rootPasswordKey }}
            - name: MYSQL_ROOT_HOST
              value: "127.0.0.1"
            {{- range $schemaName, $schema := .Values.mysql.schemas }}
            - name: {{ upper $schemaName }}_DB_NAME
              value: {{ $schema.database | quote }}
            - name: {{ upper $schemaName }}_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.mysql.appCredentialsSecret }}
                  key: {{ $schema.usernameKey }}
            - name: {{ upper $schemaName }}_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.mysql.appCredentialsSecret }}
                  key: {{ $schema.passwordKey }}
            {{- end }}
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            exec:
              command: [/bin/bash, /opt/qc-mysql/probe.sh]
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [/bin/bash, /opt/qc-mysql/probe.sh]
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            exec:
              command: [/bin/bash, /opt/qc-mysql/probe.sh]
            periodSeconds: 20
            timeoutSeconds: 6
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d/10-qc-app-bootstrap.sh
              subPath: 10-qc-app-bootstrap.sh
              readOnly: true
            - name: bootstrap
              mountPath: /opt/qc-mysql
              readOnly: true
      volumes:
        - name: data
          emptyDir: {{ .Values.mysql.emptyDir | default dict | toJson }}
        - name: bootstrap
          configMap:
            name: {{ .Values.mysql.name }}-ephemeral-bootstrap
{{- end }}
